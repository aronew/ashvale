name: Check and publish Ashvale
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the game to GitHub Pages (normally public; enable Pages first)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ashvale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Upload standalone game
        uses: actions/upload-artifact@v4
        with:
          name: ashvale-standalone
          path: dist/
          if-no-files-found: error
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && (inputs.publish == true || vars.ASHVALE_PAGES_ENABLED == 'true') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.publish == true || vars.ASHVALE_PAGES_ENABLED == 'true') && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy standalone game
        id: deployment
        uses: actions/deploy-pages@v4
